name: Apple silicon checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-wifi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture and toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Unit tests
        run: bash scripts/test.sh
      - name: Read-only native sampler smoke check
        run: swift run --disable-sandbox WiFiDiagnostics
      - name: Build and verify preview
        run: |
          bash scripts/build-app.sh
          bash scripts/package-release.sh
          codesign --verify --deep --strict "build/Pulse WiFi.app"
          test "$(lipo -archs 'build/Pulse WiFi.app/Contents/MacOS/PulseWiFi')" = arm64
          cd build
          shasum -a 256 -c Pulse-WiFi-1.0-AppleSilicon-Preview.zip.sha256
